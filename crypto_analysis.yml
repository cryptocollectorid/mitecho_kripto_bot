name: Crypto Analysis → Telegram Channel

on:
  schedule:
    # Jadwal UTC. Sesuaikan dengan kebutuhan:
    # Setiap 4 jam: '0 */4 * * *'
    # Setiap jam (day trading): '0 * * * *'
    # 2x sehari (swing): '0 8,20 * * *'
    # Setiap hari jam 07:00 UTC: '0 7 * * *'
    - cron: '0 */4 * * *'
  workflow_dispatch:   # Izinkan trigger manual dari tab Actions

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analysis Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
        run: python src/analysis_bot.py
