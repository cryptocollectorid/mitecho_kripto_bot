name: Advanced Crypto Analysis → Telegram

on:
  schedule:
    # Jam 8 pagi WIB (01:00 UTC)
    - cron: '0 1 * * *'
    # Jam 7 malam WIB (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:   # Tetap bisa dijalankan manual

jobs:
  advanced-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pyyaml pandas ta matplotlib mplfinance Pillow
          fi

      - name: Run Advanced Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        run: |
          if [ -f analysis_bot.py ]; then
            echo "Running analysis_bot.py"
            python analysis_bot.py
          else
            echo "ERROR: analysis_bot.py tidak ditemukan"
            ls -la
            exit 1
          fi
