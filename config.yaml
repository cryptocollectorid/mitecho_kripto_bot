# Daftar coin yang akan dianalisis (CoinGecko ID)
coins:
  - bitcoin
  - ethereum
  - solana
  - binancecoin
  - ripple

# Pengaturan analisis
settings:
  timezone: "UTC"
  send_separate_messages: true   # true = kirim per coin, false = satu pesan panjang
  include_global_summary: true
  max_message_length: 4000

# Threshold untuk sinyal (bisa disesuaikan)
signals:
  rsi_oversold: 30
  rsi_overbought: 70
  funding_high: 0.01          # 0.01% = 0.0001 dalam decimal
  funding_low: -0.005
  long_short_crowded: 1.8

# Catatan: Nansen & Arkham butuh API key berbayar
# Isi di GitHub Secrets jika tersedia
