# ========================
# DAFTAR COIN UTAMA
# ========================
coins:
  - bitcoin
  - ethereum
  - solana
  - binancecoin
  - ripple

# ========================
# PENGATURAN
# ========================
settings:
  timezone: "UTC"
  send_charts: true
  include_global_summary: true
  include_top_gainers: true
  include_top_losers: true
  top_movers_count: 8
  multi_timeframe: true

# ========================
# THRESHOLD SINYAL
# ========================
signals:
  rsi_oversold: 30
  rsi_overbought: 70
  funding_high: 0.01
  funding_low: -0.005
  long_short_crowded: 1.8

# ========================
# NANSEN (DUMMY / REAL)
# ========================
nansen:
  enabled: true
  use_real_api: false   # ganti true jika sudah punya API key
  dummy_message: true
